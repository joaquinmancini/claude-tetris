<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <script>
    // Aplica el tema guardado antes de pintar para evitar parpadeos (oscuro por defecto)
    try {
      if (localStorage.getItem('theme') === 'light') document.documentElement.dataset.theme = 'light';
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="title-bar">
      <h1 class="title">TETRIS</h1>
      <button id="theme-toggle" type="button" aria-label="Cambiar tema">☀ Claro</button>
    </div>

    <div class="game-area">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="start-overlay" class="overlay">
      <div class="overlay-box">
        <p id="start-title">TETRIS</p>
        <p class="records-heading">MEJORES PUNTUACIONES</p>
        <table class="records-table" id="records-start"><tbody></tbody></table>
        <p class="records-stats" id="records-stats-start"></p>
        <button id="start-btn" type="button">Jugar</button>
        <button id="reset-records-btn" class="link-btn" type="button">Borrar records</button>
      </div>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="records-over-wrap" class="hidden">
          <form id="name-form" class="hidden" autocomplete="off">
            <p id="name-msg">¡Nuevo record! Ingresa tu nombre</p>
            <div class="name-row">
              <input id="name-input" type="text" maxlength="12" placeholder="Anónimo" aria-label="Nombre" />
              <button id="save-btn" type="submit">Guardar</button>
            </div>
          </form>
          <p class="records-heading">MEJORES PUNTUACIONES</p>
          <table class="records-table" id="records-over"><tbody></tbody></table>
          <p class="records-stats" id="records-stats-over"></p>
        </div>
        <button id="restart-btn" type="button">Reiniciar</button>
      </div>
    </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
